# Docker Compose for Kindle Home Display Server
name: kindle-home-display

services:
  server:
    build:
      context: .
      target: production
    ports:
      - "8000:8000"
    volumes:
      # Mount configuration files
      - ./config.toml:/app/config.toml:ro
      - ./api_keys.json:/app/api_keys.json:ro
      - ./credentials_service.json:/app/credentials_service.json:ro
      - ./credentials_oauth.json:/app/credentials_oauth.json:ro
      # Mount data directory for logs and output
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M