[project]
name = "server"
version = "0.6.3"
description = 'Collects data from APIs and renders it as an image for the Device to request & display.'
readme = "README.md"
requires-python = "~=3.13.0"
license = "MIT"
authors = [
  { name = "Mike Holmes", email = "michael@mcholmes.com" },
]

dependencies = [
  "tzdata", # fallback in case OS doesn't have IANA timezone data
  "pydantic",
  "pillow",
  "gcsa",
  "requests",
  "toml",
  "fastapi[standard-no-fastapi-cloud-cli]",
  "todoist-api-python~=3.1.0",
  "python-dotenv>=1.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/server"]

[tool.coverage.run]
source_pkgs = ["server"] #, "tests"]
branch = true
parallel = true

[tool.coverage.paths]
server = ["src/server", "*/server/src/server"]
# tests = ["tests", "*/server/tests"]

[tool.coverage.report]
skip_empty = true
show_missing = true
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.mypy]
disallow_untyped_defs = false
disallow_incomplete_defs = false
follow_imports = "normal"
ignore_missing_imports = true
pretty = true
show_column_numbers = true
show_error_codes = true
warn_no_return = false
warn_unused_ignores = true

[tool.ruff]
extend = "ruff_defaults.toml"

[tool.ruff.lint]
extend-select = ["PTH"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true # Needed for Pydantic and FastAPI, which rely on runtime types

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pytest>=8.4.2",
    "ruff>=0.13.2", 
    "tuna>=0.5.11",
]
