[project]
name = "kindle-home-display-server"
version = "0.5.1"
description = 'Collects data from APIs and renders it as an image for the Device to request & display.'
readme = "README.md"
# requires-python = ">=3.9,<3.10" # 3.9 default on Raspberry Pi
requires-python = "~=3.12.0"
license = "MIT"
keywords = []
authors = [
  { name = "Mike Holmes", email = "michael@mcholmes.com" },
]

dependencies = [
  "tzdata", # fallback in case OS doesn't have IANA timezone data
  "pydantic",
  "pillow",
  "gcsa",
  "requests",
  "toml",
  "fastapi",
  "uvicorn[standard]",
  "typer",
  "todoist-api-python~=3.1.0",
  "fastapi-radar>=0.1.9",
]

[tool.coverage.run]
source_pkgs = ["server"] #, "tests"]
branch = true
parallel = true
omit = [
  "src/server/__about__.py",
]

[tool.coverage.paths]
server = ["src/server", "*/server/src/server"]
# tests = ["tests", "*/server/tests"]

[tool.coverage.report]
skip_empty = true
show_missing = true
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.mypy]
disallow_untyped_defs = false
disallow_incomplete_defs = false
follow_imports = "normal"
ignore_missing_imports = true
pretty = true
show_column_numbers = true
show_error_codes = true
warn_no_return = false
warn_unused_ignores = true

[tool.ruff]
extend = "ruff_defaults.toml"

[tool.ruff.lint]
extend-select = ["PTH"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true # Needed for Pydantic and FastAPI, which rely on runtime types

[dependency-groups]
dev = [
    "mypy>=1.18.2",
    "pytest>=8.4.2",
    "tuna>=0.5.11",
]
